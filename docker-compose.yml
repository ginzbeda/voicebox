# Voicebox — CPU build (default)
#
# GPU overlays (pick the one matching your hardware):
#   AMD ROCm:     docker compose -f docker-compose.yml -f docker-compose.rocm.yml up --build
#   NVIDIA CUDA:  docker compose -f docker-compose.yml -f docker-compose.cuda.yml up --build
#
# Podman (rootless) works with the same files — substitute `podman-compose`.
# See docs/content/docs/overview/podman.mdx for the WSL2 specifics.

services:
  voicebox:
    build: .
    container_name: voicebox
    restart: unless-stopped

    ports:
      # Host-side moved to 17600 so the dev/installed Voicebox can keep 17493.
      # Container still listens on its native port internally.
      - "127.0.0.1:17600:17493"

    volumes:
      # Ordered parent-first: /app/data must be established before the
      # ./output bind nested inside it, or the nested mount can be shadowed.
      # Named volume for profiles, DB, cache (persists across container restarts)
      - voicebox-data:/app/data

      # Bind-mount for generated audio (customize the host path as needed)
      # Host side:      ./output/
      # Container side: /app/data/generations/
      - ./output:/app/data/generations

      # HuggingFace model cache (so models aren't re-downloaded on rebuild)
      - huggingface-cache:/home/voicebox/.cache/huggingface

    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache

    # Declared here, not just in the Dockerfile: Podman builds OCI-format images
    # by default and silently drops the image-level HEALTHCHECK ("not supported
    # for OCI image format and will be ignored"). At the compose layer it is
    # applied at container-create time by both engines.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17493/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    networks:
      - voicebox-net

    # NOTE: `deploy.resources` is a Swarm-only key — plain `docker compose` and
    # `podman-compose` both ignore it, so the limits below are the ones that
    # actually apply. Raise them to suit your host.
    mem_limit: 8g
    cpus: 4.0
    shm_size: 1g

networks:
  voicebox-net:
    driver: bridge

volumes:
  voicebox-data:
  huggingface-cache:

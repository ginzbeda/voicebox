---
# CUDA (NVIDIA GPU) overlay for Voicebox
#
#   Podman:  podman-compose -f docker-compose.yml -f docker-compose.cuda.yml up --build
#   Docker:  docker compose  -f docker-compose.yml -f docker-compose.cuda.yml up --build
#
# The default (non-ROCm) Dockerfile branch already installs a CUDA-capable torch
# from PyPI, but recent wheels have dropped older GPU architectures: torch
# 2.13/cu130 compiles for sm_75 (Turing) and newer only. On a Pascal card the
# result is a container that looks fine — torch.cuda.is_available() is True and
# /health reports gpu_available — until the first kernel launch fails with
# "no kernel image is available for execution on the device".
#
# So this overlay pins the `cuda` build variant, which installs torch 2.6.0 from
# the cu124 index (arch list sm_50-sm_90, verified computing on a GTX 1080).
#
# On a Turing-or-newer GPU you do not need the pin. Override it to use the
# current wheels instead:
#   PYTORCH_VARIANT= podman-compose -f docker-compose.yml -f docker-compose.cuda.yml up --build
#
# Requires the NVIDIA Container Toolkit on the host, with a CDI spec generated:
#   sudo mkdir -p /etc/cdi
#   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#
# Regenerate the spec after a driver update. On WSL2 write it to /etc/cdi, not
# /var/run/cdi — the latter is tmpfs and is lost when WSL restarts.
#
# CDI (`nvidia.com/gpu=all`) is used instead of Compose's
# `deploy.resources.reservations.devices`, which is a Swarm-only key that
# podman-compose ignores. CDI also works rootless, which the legacy
# `--gpus` / nvidia runtime path does not.

services:
  voicebox:
    build:
      context: .
      args:
        PYTORCH_VARIANT: ${PYTORCH_VARIANT-cuda}
        CUDA_VERSION: ${CUDA_VERSION:-124}
        TORCH_VERSION: ${TORCH_VERSION:-2.6.0}

    devices:
      - nvidia.com/gpu=all

    security_opt:
      # The CDI-injected driver libraries sit outside the container's SELinux
      # label. Harmless on WSL2 (no SELinux); required on Fedora/RHEL hosts.
      - label=disable

    environment:
      # Pascal (GTX 10xx) and older need this unset/permissive; newer cards can
      # tighten it. Left explicit so the allocator behaviour is reproducible.
      - PYTORCH_CUDA_ALLOC_CONF=garbage_collection_threshold:0.8,max_split_size_mb:512
